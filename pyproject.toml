[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "observateur-actif-ai"
version = "0.1.0"
description = "Studio de production de documentaires vidéo pour Observateur Actif"
requires-python = ">=3.11"
dependencies = [
  "python-dotenv>=1.0,<2.0",
  "pydantic>=2.7,<3.0",
  "typer>=0.12,<1.0",
  "rich>=13.7,<15.0",
  "requests>=2.32,<3.0",
  "edge-tts>=7.2,<8.0",
  "json-repair>=0.30,<1.0",
]

[project.optional-dependencies]
youtube = [
  "google-api-python-client>=2.150,<3.0",
  "google-auth>=2.35,<3.0",
]

[project.scripts]
observateur = "observateur_actif.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
