name: Production hebdomadaire Observateur Actif

on:
  schedule:
    # Le vendredi à 20:00 UTC, pour laisser le temps de générer avant samedi 16:00 UTC.
    - cron: "0 20 * * 5"
  workflow_dispatch:
    inputs:
      project_path:
        description: "Chemin du projet documentaire JSON déjà approuvé"
        required: true
        type: string
        default: "projects/weekly_documentary.json"

permissions:
  contents: read

concurrency:
  group: observateur-actif-weekly-production
  cancel-in-progress: false

jobs:
  production:
    name: Génération, contrôle et programmation YouTube
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      VIDEO_PROVIDER: agnes
      AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
      AGNES_FREE_QUOTA_CONFIRMED: ${{ vars.AGNES_FREE_QUOTA_CONFIRMED }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
      PROJECT_FILE: ${{ inputs.project_path || 'projects/weekly_documentary.json' }}

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Vérifier le projet et les autorisations avant toute dépense
        id: preflight
        shell: bash
        run: |
          if [ ! -f "$PROJECT_FILE" ]; then
            echo "Projet absent : $PROJECT_FILE. Aucun crédit vidéo ne sera consommé."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for name in AGNES_API_KEY YOUTUBE_CLIENT_ID YOUTUBE_CLIENT_SECRET YOUTUBE_REFRESH_TOKEN YOUTUBE_CHANNEL_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret requis absent : $name"
              exit 1
            fi
          done
          if [ "$AGNES_FREE_QUOTA_CONFIRMED" != "true" ]; then
            echo "::error::Production arrêtée : confirme le quota Agnes gratuit via AGNES_FREE_QUOTA_CONFIRMED=true."
            exit 1
          fi
          python - <<'PY'
          import json, os, sys
          path = os.environ["PROJECT_FILE"]
          with open(path, encoding="utf-8") as f:
              project = json.load(f)
          if not project.get("release_approved") or not project.get("release_reviewer") or not project.get("release_approved_at"):
              sys.exit("Publication bloquée : le projet n'a pas d'approbation éditoriale explicite.")
          scenes = project.get("scenes", [])
          if not scenes or any(not s.get("review_approved") or not s.get("reviewer") or not s.get("reviewed_at") for s in scenes):
              sys.exit("Production bloquée : chaque scène doit être approuvée par un réviseur identifié.")
          print(f"Projet approuvé : {project.get('title')} ({len(scenes)} scènes).")
          from datetime import datetime, timedelta, timezone
          now = datetime.now(timezone.utc)
          days = (5 - now.weekday()) % 7
          target = (now + timedelta(days=days)).replace(hour=16, minute=0, second=0, microsecond=0)
          if target <= now:
              target += timedelta(days=7)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"publish_at={target.isoformat()}\\n")
          PY
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Installer Python
        if: steps.preflight.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer Observateur Actif AI et les outils YouTube
        if: steps.preflight.outputs.ready == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install '.[youtube]'

      - name: Tester Edge-TTS et les repères de sous-titres avant les clips vidéo
        if: steps.preflight.outputs.ready == 'true'
        run: |
          cat > /tmp/edge-tts-preflight.json <<'JSON'
          {"title":"Prévalidation audio","target_duration_minutes":10,"scenes":[{"id":"audio-test","duration_seconds":5,"narration":"Ceci est un contrôle technique de la narration française et de ses sous-titres synchronisés.","video_prompt":"No video generation in this test.","motion_description":"No video generation in this test.","claim_status":"unconfirmed"}]}
          JSON
          observateur generate-audio /tmp/edge-tts-preflight.json --output /tmp/edge-tts-preflight.mp3 --subtitles /tmp/edge-tts-preflight.srt
          test -s /tmp/edge-tts-preflight.mp3
          test -s /tmp/edge-tts-preflight.srt
          grep -q -- '-->' /tmp/edge-tts-preflight.srt

      - name: Générer les scènes, la voix off, les sous-titres et le montage
        if: steps.preflight.outputs.ready == 'true'
        run: observateur produce "$PROJECT_FILE" --output-dir output

      - name: Vérifier techniquement le MP4 final
        if: steps.preflight.outputs.ready == 'true'
        run: observateur quality-check output/documentary.mp4 --report output/quality_report.json

      - name: Programmer la publication YouTube pour samedi 16 h UTC
        if: steps.preflight.outputs.ready == 'true'
        run: observateur publish-youtube "$PROJECT_FILE" --video output/documentary.mp4 --publish-at "${{ steps.preflight.outputs.publish_at }}"

      - name: Archiver la vidéo et les rapports
        if: always() && steps.preflight.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: observateur-actif-documentary
          path: |
            output/documentary.mp4
            output/scenes/*.mp4
            output/narration.mp3
            output/narration.srt
            output/production_report.json
            output/quality_report.json
            projects/weekly_documentary.json
          if-no-files-found: warn
          retention-days: 7
