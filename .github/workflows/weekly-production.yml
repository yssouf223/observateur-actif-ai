name: Production hebdomadaire Observateur Actif

on:
  push:
    paths:
      - '.github/workflows/weekly-production.yml'
  schedule:
    # Le vendredi à 20:00 UTC, pour laisser le temps de générer avant samedi 16:00 UTC.
    - cron: "0 20 * * 5"
  workflow_dispatch:
    inputs:
      project_path:
        description: "Chemin du projet documentaire JSON déjà approuvé"
        required: true
        type: string
        default: "projects/weekly_documentary.json"

permissions:
  contents: read

concurrency:
  group: observateur-actif-weekly-production
  cancel-in-progress: false

jobs:
  production:
    name: Génération, contrôle et programmation YouTube
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      VIDEO_PROVIDER: agnes
      AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
      AGNES_FREE_QUOTA_CONFIRMED: ${{ vars.AGNES_FREE_QUOTA_CONFIRMED }}
      EDGE_TTS_COMMERCIAL_RIGHTS_CONFIRMED: ${{ vars.EDGE_TTS_COMMERCIAL_RIGHTS_CONFIRMED }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
      PROJECT_FILE: ${{ inputs.project_path || 'projects/weekly_documentary.json' }}

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Vérifier le projet et les autorisations avant toute dépense
        id: preflight
        shell: bash
        run: |
          if [ ! -f "$PROJECT_FILE" ]; then
            echo "Projet absent : $PROJECT_FILE. Aucun crédit vidéo ne sera consommé."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - <<'PY'
          import json, os, sys
          path = os.environ["PROJECT_FILE"]
          with open(path, encoding="utf-8") as f:
              project = json.load(f)
          scenes = project.get("scenes", [])
          if not project.get("release_approved") or not project.get("release_reviewer") or not project.get("release_approved_at"):
              print("Projet non approuvé : aucune génération vidéo ni publication ne sera lancée.")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write("ready=false\n")
              sys.exit(0)
          if not scenes or any(not s.get("review_approved") or not s.get("reviewer") or not s.get("reviewed_at") for s in scenes):
              print("Des scènes ne sont pas approuvées : aucune génération vidéo ni publication ne sera lancée.")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write("ready=false\n")
              sys.exit(0)
          print(f"Projet approuvé : {project.get('title')} ({len(scenes)} scènes).")
          from datetime import datetime, timedelta, timezone
          now = datetime.now(timezone.utc)
          days = (5 - now.weekday()) % 7
          target = (now + timedelta(days=days)).replace(hour=16, minute=0, second=0, microsecond=0)
          if target <= now:
              target += timedelta(days=7)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"publish_at={target.isoformat()}\n")
          PY
          if grep -q '^ready=false$' "$GITHUB_OUTPUT"; then
            exit 0
          fi
          for name in AGNES_API_KEY YOUTUBE_CLIENT_ID YOUTUBE_CLIENT_SECRET YOUTUBE_REFRESH_TOKEN YOUTUBE_CHANNEL_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret requis absent : $name"
              exit 1
            fi
          done
          if [ "$AGNES_FREE_QUOTA_CONFIRMED" != "true" ]; then
            echo "::error::Production arrêtée : confirme le quota Agnes gratuit via AGNES_FREE_QUOTA_CONFIRMED=true."
            exit 1
          fi
          if [ "$EDGE_TTS_COMMERCIAL_RIGHTS_CONFIRMED" != "true" ]; then
            echo "::error::Publication bloquée : droits d'utilisation commerciale de la voix Edge-TTS non confirmés."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Installer Python
        if: steps.preflight.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer Observateur Actif AI et les outils YouTube
        if: steps.preflight.outputs.ready == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install '.[youtube]'

      - name: Installer FFmpeg et ffprobe
        if: steps.preflight.outputs.ready == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Vérifier FFmpeg et ffprobe
        if: steps.preflight.outputs.ready == 'true'
        run: |
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | head -n 1

      - name: Prévalider l'accès Agnes et le compte YouTube avant les clips
        if: steps.preflight.outputs.ready == 'true'
        run: |
          python - <<'PY'
          import json, os, requests
          response = requests.get(
              "https://apihub.agnes-ai.com/v1/models",
              headers={"Authorization": f"Bearer {os.environ['AGNES_API_KEY']}"},
              timeout=30,
          )
          response.raise_for_status()
          payload = response.json()
          models = payload.get("data", payload.get("models", []))
          names = {item.get("id") or item.get("name") for item in models if isinstance(item, dict)}
          if "agnes-video-2.5-flash" not in names:
              raise SystemExit("Le modèle Agnes Video 2.5 Flash n'est pas visible pour cette clé.")
          print("Clé Agnes valide et modèle vidéo disponible.")
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          credentials = Credentials(
              token=None,
              refresh_token=os.environ["YOUTUBE_REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["YOUTUBE_CLIENT_ID"],
              client_secret=os.environ["YOUTUBE_CLIENT_SECRET"],
              scopes=[
                  "https://www.googleapis.com/auth/youtube.upload",
                  "https://www.googleapis.com/auth/youtube.readonly",
              ],
          )
          youtube = build("youtube", "v3", credentials=credentials, cache_discovery=False)
          result = youtube.channels().list(part="id", mine=True).execute()
          channels = result.get("items", [])
          if not channels or channels[0].get("id") != os.environ["YOUTUBE_CHANNEL_ID"]:
              raise SystemExit("OAuth YouTube invalide ou identifiant de chaîne incorrect.")
          print("Compte OAuth YouTube valide et chaîne confirmée.")
          PY

      - name: Tester Edge-TTS et les repères de sous-titres avant les clips vidéo
        if: steps.preflight.outputs.ready == 'true'
        run: |
          cat > /tmp/edge-tts-preflight.json <<'JSON'
          {"title":"Prévalidation audio","target_duration_minutes":10,"scenes":[{"id":"audio-test","duration_seconds":5,"narration":"Ceci est un contrôle technique de la narration française et de ses sous-titres synchronisés.","video_prompt":"No video generation in this test.","motion_description":"No video generation in this test.","claim_status":"unconfirmed"}]}
          JSON
          observateur generate-audio /tmp/edge-tts-preflight.json --output /tmp/edge-tts-preflight.mp3 --subtitles /tmp/edge-tts-preflight.srt
          test -s /tmp/edge-tts-preflight.mp3
          test -s /tmp/edge-tts-preflight.srt
          grep -q -- '-->' /tmp/edge-tts-preflight.srt

      - name: Générer les scènes, la voix off, les sous-titres et le montage
        if: steps.preflight.outputs.ready == 'true'
        run: observateur produce "$PROJECT_FILE" --output-dir output

      - name: Vérifier techniquement le MP4 final
        if: steps.preflight.outputs.ready == 'true'
        run: observateur quality-check output/documentary.mp4 --report output/quality_report.json

      - name: Programmer la publication YouTube pour samedi 16 h UTC
        if: steps.preflight.outputs.ready == 'true'
        run: observateur publish-youtube "$PROJECT_FILE" --video output/documentary.mp4 --publish-at "${{ steps.preflight.outputs.publish_at }}"

      - name: Archiver la vidéo et les rapports
        if: always() && steps.preflight.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: observateur-actif-documentary
          path: |
            output/documentary.mp4
            output/scenes/*.mp4
            output/narration.mp3
            output/narration.srt
            output/production_report.json
            output/quality_report.json
            projects/weekly_documentary.json
            projects/editorial_review.md
          if-no-files-found: warn
          retention-days: 7
