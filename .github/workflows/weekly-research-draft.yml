name: Recherche et brouillon hebdomadaire

on:
  schedule:
    # Préparer le sujet du samedi chaque mercredi à 14:00 UTC.
    - cron: "0 14 * * 3"
  workflow_dispatch:
    inputs:
      topic:
        description: "Sujet documentaire facultatif"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: observateur-actif-weekly-draft
  cancel-in-progress: false

jobs:
  draft:
    name: Recherche publique et storyboard IA
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TOPIC: ${{ inputs.topic }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer Observateur Actif AI
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Vérifier la clé Gemini
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Le secret GEMINI_API_KEY est absent."
            exit 1
          fi

      - name: Collecter les pistes RSS
        run: observateur research-rss --output projects/research_leads.json

      - name: Ouvrir les articles originaux
        run: observateur fetch-leads --input projects/research_leads.json --output projects/source_documents.json --limit 20

      - name: Créer un brouillon documentaire avec Gemini
        run: |
          mkdir -p projects
          observateur draft-project --sources projects/source_documents.json --output projects/weekly_documentary.json --topic "$TOPIC"

      - name: Enregistrer le brouillon dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/weekly_documentary.json
          if git diff --cached --quiet; then
            echo "Aucun changement de brouillon à enregistrer."
          else
            git commit -m "Prepare weekly documentary draft"
            git push
          fi

      - name: Archiver les documents de recherche
        uses: actions/upload-artifact@v4
        with:
          name: observateur-actif-weekly-research
          path: |
            projects/research_leads.json
            projects/source_documents.json
            projects/weekly_documentary.json
          if-no-files-found: error
          retention-days: 14
