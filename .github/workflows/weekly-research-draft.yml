name: Recherche et brouillon hebdomadaire

on:
  push:
    paths:
      - '.github/workflows/weekly-research-draft.yml'
      - 'src/observateur_actif/research.py'
      - 'src/observateur_actif/scriptwriter.py'
      - 'config/research_feeds.json'
  schedule:
    # Préparer le sujet du samedi chaque mercredi à 14:00 UTC.
    - cron: "0 14 * * 3"
  workflow_dispatch:
    inputs:
      topic:
        description: "Sujet documentaire facultatif"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: observateur-actif-weekly-draft
  cancel-in-progress: false

jobs:
  draft:
    name: Recherche publique et storyboard IA
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
      SCRIPT_PROVIDER: agnes
      TOPIC: ${{ inputs.topic }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer Observateur Actif AI
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Vérifier l'accès au modèle de texte Agnes gratuit
        run: |
          if [ -z "$AGNES_API_KEY" ]; then
            echo "::error::Le secret AGNES_API_KEY est absent."
            exit 1
          fi
          python - <<'PY'
          import os, requests
          response = requests.get(
              "https://apihub.agnes-ai.com/v1/models",
              headers={"Authorization": f"Bearer {os.environ['AGNES_API_KEY']}"},
              timeout=30,
          )
          response.raise_for_status()
          payload = response.json()
          models = payload.get("data", payload.get("models", []))
          names = {item.get("id") or item.get("name") for item in models if isinstance(item, dict)}
          if "agnes-2.5-flash" not in names:
              raise SystemExit("La clé ne donne pas accès à agnes-2.5-flash.")
          print("Accès au modèle de texte Agnes 2.5 Flash confirmé.")
          PY

      - name: Collecter les pistes RSS
        run: observateur research-rss --output projects/research_leads.json

      - name: Ouvrir les articles originaux
        run: observateur fetch-leads --input projects/research_leads.json --output projects/source_documents.json --limit 20

      - name: Créer un brouillon documentaire avec Agnes
        run: |
          mkdir -p projects
          observateur draft-project --sources projects/source_documents.json --output projects/weekly_documentary.json --topic "$TOPIC"

      - name: Mettre à jour l'historique des sujets pour éviter les répétitions
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          project = json.loads(Path("projects/weekly_documentary.json").read_text(encoding="utf-8"))
          history_path = Path("projects/topic_history.json")
          history = json.loads(history_path.read_text(encoding="utf-8")) if history_path.exists() else []
          title = project.get("title", "").strip()
          synopsis = " ".join(scene.get("narration", "") for scene in project.get("scenes", [])[:4])[:900]
          if title and not any(item.get("title", "").casefold() == title.casefold() for item in history):
              history.append({
                  "title": title,
                  "notes": "Brouillon déjà proposé ; éviter de reprendre le même événement, lieu ou histoire, même sous un autre titre. " + synopsis,
                  "created_at": datetime.now(timezone.utc).isoformat(),
                  "status": "draft",
              })
          history_path.parent.mkdir(parents=True, exist_ok=True)
          history_path.write_text(json.dumps(history, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"Historique éditorial : {len(history)} sujet(s).")
          PY

      - name: Exporter le dossier de revue éditoriale
        run: observateur review-project projects/weekly_documentary.json --output projects/editorial_review.md

      - name: Archiver les documents de recherche
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observateur-actif-weekly-research
          path: |
            projects/research_leads.json
            projects/source_documents.json
            projects/weekly_documentary.json
            projects/editorial_review.md
            projects/topic_history.json
          if-no-files-found: warn
          retention-days: 14

      - name: Enregistrer le brouillon dans le dépôt
        if: always() && steps.preflight.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/weekly_documentary.json projects/editorial_review.md projects/topic_history.json
          if git diff --cached --quiet; then
            echo "Aucun changement de brouillon à enregistrer."
          else
            git commit -m "Prepare weekly documentary draft"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push; then
                echo "Brouillon enregistré dans main."
                exit 0
              fi
              echo "Push refusé ; nouvelle tentative après synchronisation."
              git rebase --abort || true
              sleep $((attempt * 3))
            done
            echo "::error::Impossible d'enregistrer le brouillon après trois tentatives."
            exit 1
          fi
