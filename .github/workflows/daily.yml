
name: Observateur Actif AI - Production quotidienne

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Verifier le fonctionnement
        run: |
          python --version
          ffmpeg -version
          echo "OBSERVATEUR ACTIF AI EST OPERATIONNEL"
          date -u
