
name: Observateur Actif AI - Recherche quotidienne

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer Gemini
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Lancer Observateur Actif AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main.py

      - name: Sauvegarder les recherches
        uses: actions/upload-artifact@v4
        with:
          name: observateur-actif-recherche
          path: output/daily_research.json
          if-no-files-found: error
          retention-days: 7
