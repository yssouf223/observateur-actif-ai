
name: Observateur Actif AI

on:
  workflow_dispatch:

  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: read

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installer FFmpeg et les polices
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Installer les dependances Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verifier FFmpeg
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Verifier les fichiers du projet
        run: |
          python -c "from pathlib import Path; files=['main.py','config.json','recherche/moteur.py','recherche/verification.py','intelligence/scripts.py','video/voix.py','video/montage.py','recherche_images.py']; missing=[f for f in files if not Path(f).exists()]; print('Fichiers manquants:', missing); assert not missing, 'Structure du projet incomplete'"

      - name: Executer Observateur Actif AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main.py

      - name: Sauvegarder les resultats de production
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observateur-actif-resultats
          path: |
            data/
            images/telechargements/
            **/*.mp3
            **/*.wav
            **/*.mp4
          if-no-files-found: warn
          retention-days: 7
