name: Test réel Edge-TTS

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/observateur_actif/speech.py'
      - '.github/workflows/edge-tts-smoke-test.yml'

permissions:
  contents: read

jobs:
  edge-tts-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer FFmpeg pour vérifier le MP3
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          command -v ffprobe

      - name: Installer Observateur Actif AI
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Préparer un court texte de test
        run: |
          mkdir -p output
          python - <<'PY'
          import json
          project = {
              "title": "Test vocal Edge-TTS",
              "target_duration_minutes": 10,
              "aspect_ratio": "16:9",
              "language": "fr",
              "sources": [],
              "scenes": [{
                  "id": "test-voice",
                  "duration_seconds": 5,
                  "narration": "Dans les profondeurs de la forêt africaine, chaque bruit raconte une histoire. Ceci est un test de la voix française Henri pour Observateur Actif.",
                  "video_prompt": "Test technique, aucune vidéo ne sera générée.",
                  "motion_description": "Test technique, aucun mouvement vidéo ne sera généré.",
                  "claim_status": "unconfirmed",
                  "source_ids": [],
                  "review_approved": False
              }]
          }
          with open("/tmp/edge_tts_test.json", "w", encoding="utf-8") as f:
              json.dump(project, f, ensure_ascii=False, indent=2)
          PY

      - name: Générer le MP3 avec le vrai service Edge-TTS
        run: |
          observateur generate-audio /tmp/edge_tts_test.json --output output/edge-tts-test.mp3 --subtitles output/edge-tts-test.srt
          python - <<'PY'
          from pathlib import Path
          p = Path("output/edge-tts-test.mp3")
          data = p.read_bytes()
          if len(data) < 1000 or not (data.startswith(b"ID3") or data[:1] == b"\xff"):
              raise SystemExit("Le fichier généré ne ressemble pas à un MP3 exploitable.")
          print(f"MP3 réel créé : {p} ({len(data)} octets)")
          PY

      - name: Vérifier le MP3 et les sous-titres synchronisés
        run: |
          test -s output/edge-tts-test.mp3
          duration="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 output/edge-tts-test.mp3)"
          python - "$duration" <<'PY'
          import re, sys
          from pathlib import Path
          duration = float(sys.argv[1])
          if duration < 1:
              raise SystemExit(f"Durée MP3 anormale : {duration}s")
          srt = Path("output/edge-tts-test.srt").read_text(encoding="utf-8")
          pattern = re.compile(r"^(\\d{2}:\\d{2}:\\d{2},\\d{3}) --> (\\d{2}:\\d{2}:\\d{2},\\d{3})$", re.M)
          matches = pattern.findall(srt)
          if not matches:
              raise SystemExit("Aucun intervalle SRT valide.")
          def ms(value):
              h, m, rest = value.split(":")
              sec, milli = rest.split(",")
              return ((int(h) * 60 + int(m)) * 60 + int(sec)) * 1000 + int(milli)
          previous_end = -1
          for start, end in matches:
              a, b = ms(start), ms(end)
              if a < previous_end or b <= a:
                  raise SystemExit("Les repères SRT ne sont pas chronologiques ou ont une durée nulle.")
              previous_end = b
              if b > duration * 1000 + 1500:
                  raise SystemExit("Un sous-titre dépasse anormalement la durée du MP3.")
          print(f"MP3 décodable : {duration:.2f}s ; {len(matches)} segments SRT valides et chronologiques.")
          PY

      - name: Déposer le MP3 de test
        uses: actions/upload-artifact@v4
        with:
          name: edge-tts-test-mp3
          path: |
            output/edge-tts-test.mp3
            output/edge-tts-test.srt
          if-no-files-found: error
          retention-days: 3
